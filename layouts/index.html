<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <meta name="description" content="Rozcestník radioamatérských závodů pod značkou HAM Závod.">
    <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
    <header class="hero">
        <div class="hero__inner">
            <p class="eyebrow">Centrální rozcestník</p>
            <h1>HAM Závod</h1>
            <p class="lead">
                Stránky věnované radioamatérským závodům.
            </p>
        </div>
    </header>

    <main>
        <section class="panel">
            <h2>Závody</h2>
            <div class="cards">
                <a class="card card--image" href="https://digi.hamzavod.cz">
                    <strong>DIGI závod</strong>
                    <img
                        src="https://digi.hamzavod.cz/wp-content/uploads/2024/01/IMG_20231117_165721-2048x977.jpg"
                        width="100"
                        height="100"
                        alt="DIGI závod"
                    >
                </a>

                <a class="card card--image" href="https://ok1kbt.fbmi.cvut.cz/mikulassky-zavod/">
                    <strong>Mikulášský závod</strong>
                    <img
                        src="https://ok1kbt.fbmi.cvut.cz/wp-content/uploads/2024/11/CQ-Mikulas-768x768.jpg"
                        width="100"
                        height="100"
                        alt="Mikulášský závod"
                    >
                </a>

                <a class="card card--image" href="http://ok1srd.hrnek.cz/carodej/index.htm">
                    <strong>Čarodějnický závod</strong>
                    <img
                        src="http://ok1srd.hrnek.cz/images/witch.jpg"
                        width="100"
                        height="100"
                        alt="Čarodějnický závod"
                    >
                </a>
            </div>
        </section>

        <section class="panel panel--muted">
            <h2>O projektu</h2>
            <p>
                HAM Závod je společný rozcestník pro radioamatérské závody.
            </p>
            <p>
                Podrobnosti k jednotlivým závodům najdete na jejich stránkách.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HAM Závod · <a href="https://github.com/petrkr/hamzavodcz">GitHub</a></p>
    </footer>
</body>
</html>
