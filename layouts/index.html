<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <meta name="description" content="Rozcestník radioamatérských závodů pod značkou HAM Závod.">
    <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
    <header class="hero">
        <div class="hero__inner">
            <p class="eyebrow">Centrální rozcestník</p>
            <h1>HAM Závod</h1>
            <p class="lead">
                Stránky věnované radioamatérským závodům.
            </p>
        </div>
    </header>

    <main>
        <section class="panel">
            <h2>Závody</h2>
            <div id="contests" class="cards"></div>
        </section>

        <section class="panel panel--muted">
            <h2>O projektu</h2>
            <p>
                HAM Závod je společný rozcestník pro radioamatérské závody.
            </p>
            <p>
                Podrobnosti k jednotlivým závodům najdete na jejich stránkách.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HAM Závod · <a href="https://github.com/petrkr/hamzavodcz">GitHub</a></p>
    </footer>
    <script>
        async function loadContests() {
            const container = document.getElementById("contests");
            if (!container) {
                return;
            }

            try {
                const response = await fetch("{{ "contests/contests.json" | relURL }}");
                if (!response.ok) {
                    throw new Error("Failed to load contests");
                }

                const contests = await response.json();
                const fragment = document.createDocumentFragment();

                for (const contest of contests) {
                    const link = document.createElement("a");
                    link.className = contest.image ? "card card--image" : "card";
                    link.href = contest.url;

                    const title = document.createElement("strong");
                    title.textContent = contest.name;
                    link.appendChild(title);

                    if (contest.image) {
                        const image = document.createElement("img");
                        image.src = contest.image;
                        image.alt = contest.name;
                        link.appendChild(image);
                    } else {
                        const meta = document.createElement("span");
                        meta.textContent = contest.url
                            .replace(/^https?:\/\//, "")
                            .replace(/\/$/, "");
                        link.appendChild(meta);
                    }

                    fragment.appendChild(link);
                }

                container.replaceChildren(fragment);
            } catch (error) {
                console.error(error);
            }
        }

        loadContests();
    </script>
</body>
</html>
